[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "museum-wallpapers-macos"
dynamic = ["version"]
description = "Endless public-domain paintings from museums worldwide as your Mac wallpaper, with the title, artist and story one click away."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dpsk" }]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.1",
    "fonttools>=4.40",
    "truststore>=0.9",
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
museum-wallpapers = "museum_wallpapers.__main__:main"

[project.urls]
Homepage = "https://github.com/dpsk/museum-wallpapers-macos"
"Omarchy plugin" = "https://github.com/dpsk/omarchy-museum-wallpapers"
"Windows app" = "https://github.com/dpsk/museum-wallpapers-windows"

[tool.setuptools.dynamic]
version = { attr = "museum_wallpapers.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
museum_wallpapers = ["data/*.json.gz", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
